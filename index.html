<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Pintar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Pengaturan Font Global & Warna Dasar Putih Tulang */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #fcfbf7; 
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Tema Warna Tosca untuk Header & Footer */
        .bg-tosca {
            background-color: #0d9488 !important; 
        }
        .btn-tosca {
            background-color: #14b8a6; 
            color: #ffffff;
            border: none;
        }
        .btn-tosca:hover {
            background-color: #0d9488;
            color: #ffffff;
        }
        .text-tosca {
            color: #0d9488 !important;
        }

        /* Kustomisasi Card & Tabel */
        .card { 
            border: none; 
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.08); 
            background-color: #ffffff;
        }
        .table-light-tosca {
            background-color: #f0fdfa;
            color: #0f766e;
        }

        /* Pembungkus Konten Utama agar Footer Tetap di Bawah */
        main {
            flex: 1;
        }
    </style>
</head>
<body>

<header class="bg-tosca text-white shadow-sm py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <span class="fs-4 fw-bold letter-spacing">Kasir<span class="fw-light text-warning">Pintar</span></span>
        </div>
        <nav>
            <span class="badge bg-light text-tosca fw-semibold px-3 py-2">Struktur Kontrol JS</span>
        </nav>
    </div>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-11">
            <div class="row g-4">
                
                <div class="col-md-4">
                    <div class="card p-4 rounded-3">
                        <h5 class="card-title fw-bold text-tosca mb-3">Input Barang</h5>
                        <div id="alertInvalid" class="alert alert-danger text-center m-0" role="alert" style="display: none;">
                            <strong>Mohon masukkan nama barang dan harga yang valid!</strong>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Nama Barang</label>
                            <input type="text" id="namaBarang" class="form-control" placeholder="Contoh: Kopi Susu">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Harga (Rp)</label>
                            <input type="number" id="hargaBarang" class="form-control" placeholder="0">
                        </div>
                        <button onclick="tambahItem()" class="btn btn-tosca w-100 fw-medium py-2">Tambah ke Keranjang</button>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card p-4 rounded-3">
                        <h5 class="card-title fw-bold text-tosca mb-3">Daftar Keranjang Belanja</h5>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead class="table-light-tosca fw-semibold">
                                    <tr>
                                        <th style="width: 10%">No</th>
                                        <th style="width: 55%">Nama Barang</th>
                                        <th style="width: 35%">Harga</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelItem">
                                    <tr>
                                        <td colspan="3" class="text-center text-muted py-4">Belum ada barang di keranjang.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-4 border-top pt-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Subtotal:</span>
                                <span id="subtotal" class="fw-medium">Rp 0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2 text-danger">
                                <span>Diskon (<span id="infoDiskon">0%</span>):</span>
                                <span id="potonganHarga" class="fw-medium">- Rp 0</span>
                            </div>
                            <div class="d-flex justify-content-between fw-bold fs-5 mt-3 border-top pt-2 text-tosca">
                                <span>Total Bayar:</span>
                                <span id="totalBayar">Rp 0</span>
                            </div>
                        </div>
                        
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<script>
    let keranjang = [];

    function tambahItem() {
        const nama = document.getElementById('namaBarang').value;
        const harga = parseInt(document.getElementById('hargaBarang').value);
        const alertElement = document.getElementById('alertInvalid');

        if (nama === '' || harga === '' || isNaN(harga) || harga <= 0) {
            alertElement.style.display = "block";
            return;
        } 
            alertElement.style.display = "none";
        
        // Masukkan data ke array
        keranjang.push({ nama: nama, harga: harga });

        // Bersihkan input form
        document.getElementById('namaBarang').value = '';
        document.getElementById('hargaBarang').value = '';

        updateTampilan();
    }

    function updateTampilan() {
        const tabel = document.getElementById('tabelItem');
        let htmlTable = '';
        let subtotal = 0;

        if (keranjang.length === 0) {
            tabel.innerHTML = `<tr><td colspan="3" class="text-center text-muted 
            py-4">Belum ada barang di keranjang.</td></tr>`;
            document.getElementById('subtotal').textContent = 'Rp 0';
            document.getElementById('infoDiskon').textContent = '0%';
            document.getElementById('potonganHarga').textContent = '- Rp 0';
            document.getElementById('totalBayar').textContent = 'Rp 0';
            return;
        }

        // 1. LOGIKA PERULANGAN (Menyusun Baris Tabel)
        for (let i = 0; i < keranjang.length; i++) {
            htmlTable += `
                <tr>
                    <td class="fw-medium">${i + 1}</td>
                    <td>${keranjang[i].nama}</td>
                    <td class="fw-medium">Rp ${keranjang[i].harga.toLocaleString
                        ('id-ID')}</td>
                </tr>
            `;
            subtotal += keranjang[i].harga;
        }
        tabel.innerHTML = htmlTable;

        // 2. LOGIKA PECABANGAN (Menghitung Diskon Bertingkat)
        let persenDiskon = 0;
        if (subtotal >= 500000) {
            persenDiskon = 30;
        } else if (subtotal >= 200000) {
            persenDiskon = 20;
        }else if (subtotal >= 100000) {
            persenDiskon = 10;
        }

        let potongan = (persenDiskon / 100) * subtotal;
        let totalAkhir = subtotal - potongan;

        // Memperbarui UI Informasi Pembayaran
        document.getElementById('subtotal').innerText = "Rp " + subtotal.toLocaleString('id-ID');
        document.getElementById('infoDiskon').innerText = persenDiskon + "%";
        document.getElementById('potonganHarga').innerText = "- Rp " + potongan.toLocaleString('id-ID');
        document.getElementById('totalBayar').innerText = "Rp " + totalAkhir.toLocaleString('id-ID');
    }
</script>

<footer class="bg-tosca text-white text-center py-3 mt-auto border-top border-light border-opacity-10">
    <div class="container">
        <p class="mb-1 small">&copy; 2026 Pengenalan Perancangan Web.</p>
    </div>
</footer>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
